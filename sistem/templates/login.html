<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.png">
    <title>Sistema Web</title>
    <style>
        body {
        background: linear-gradient(to right, #444444 50%, #5f0000 50%);
        background-size: cover;
        background-repeat: no-repeat;
        color: rgb(255, 255, 255);
        font-family: 'Roboto', sans-serif;
        margin: 0;
        padding: 0;
    }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            padding: 10px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .logo-container img {
            max-width: 500px;
            height: auto;
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.39);
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            width: 100%;
            max-width: 300px;
            position: relative;
            top: 25px; /* Descer o container 0.2cm */
            z-index: 10; /* Garante que o login sempre esteja na frente */
            /* Removido o box-shadow vermelho */
        }

        .login-container input {
            display: block;
            margin: 10px 0;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 123, 255, 0);
            background-color: rgb(255, 255, 255);
            color: rgb(0, 0, 0);
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            box-shadow: 0 0 8px rgba(0, 149, 255, 0);
            outline: none; /* Remove a linha preta */
        }

        .login-container input:focus {
            outline: none; /* Remove a linha preta ao focar nos campos de preenchimentos */
            border: 1px solid rgba(255, 0, 0, 0.7); /* Adiciona uma borda mais suave no foco do preenchimento */
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.7);
        }

        .login-container button {
            padding: 10px;
            width: 100%;
            background-color: #63db95;
            border: none;
            color: white;
            border-radius: 5px;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-container button:hover {
            background-color: #8F0000;
        }

        .login-container label {
            margin: 10px 0 5px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            color: black;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            font-size: 14px;
            margin-top: 10px;
        }

        .checkbox-container input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            background-color: transparent;
            border: 2px solid #ff0000;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            position: relative;
            margin-right: 10px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .checkbox-container input[type="checkbox"]:checked::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #760101;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px #ff0000;
        }

        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0);
            padding: 10px 0;
            font-size: 10px;
            z-index: 1; /* Coloca o footer em um plano mais baixo */
        }

        .footer a {
            color: var(--footer-text);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .main-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            z-index: 2; /* Garante que o conteúdo principal fique atrás do login */
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <img src="/static/images/logo.PNG" alt="Logo">
    </div>

    <div class="main-container">
        <div class="login-container">
            <form method="POST">
                {% csrf_token %}
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" name="usuario" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
                <div class="checkbox-container">
                    <input type="checkbox" id="manter_conectado" name="manter_conectado">
                    <label for="manter_conectado">Me manter conectado</label>
                </div>
                <button type="submit">Acessar</button>
            </form>
            {% if erro %}
            <p style="color: red;">{{ erro }}</p>
            {% endif %}
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Desenvolvido pelo Departamento de Business Intelligence do Grupo Centro Oeste Lubrificantes - 07.606.538/0001-93</p>
        
        <a href="https://wa.me/+556792017120" target="_blank" style="color: var(--footer-text); margin-right: 15px;">
            <i class="bi bi-whatsapp"></i> Sabrina Manzoli | Coordenadora de Business Intelligence  
        </a>
        
        <a href="https://wa.me/+556792113061" target="_blank" style="color: var(--footer-text); margin-right: 15px;">
            <i class="bi bi-whatsapp"></i> Vander Denardi | Analista de Business Intelligence
        </a>
    </footer>
</body>

</html>
