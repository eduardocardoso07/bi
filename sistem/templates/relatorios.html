<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <title>Relatórios Disponíveis</title>
    <style>
        /* Estilo para o corpo da página */
        body {
            background: linear-gradient(to right, black, #080160, black);
            background-size: cover;
            background-repeat: no-repeat;
            color: white;
            padding: 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            margin: 0;
            box-sizing: border-box;
        }

        /* Container principal dos relatórios */
        .reports-container {
            background-color: rgba(0, 0, 0, 0.3); /* Fundo semi-transparente */
            padding: 20px;
            border-radius: 10px; /* Bordas arredondadas */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* Sombra para efeito de elevação */
            text-align: center;
            width: 100%; /* Largura total */
            max-width: 1200px; /* Largura máxima */
            height: 90vh; /* Altura máxima */
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribui o espaço igualmente entre os filhos */
        }

        /* Estilo do título */
        .reports-container h1 {
            margin-bottom: 10px;
            font-size: 1.8em;
            border-bottom: 2px solid #8F0000; /* Linha abaixo do título */
            padding-bottom: 10px;
        }

        /* Estilo para o contêiner de lista com rolagem */
        .reports-list {
            flex: 1; /* Faz o contêiner crescer para preencher o espaço disponível */
            overflow-y: auto; /* Adiciona rolagem vertical */
            padding: 10px;
        }

        /* Estilo para a lista de relatórios */
        .reports-container ul {
            list-style-type: none; /* Remove os marcadores da lista */
            padding: 0;
            display: flex;
            flex-wrap: wrap; /* Permite que os itens quebrem linha */
            justify-content: center; /* Centraliza os itens horizontalmente */
            margin: 0;
        }

        /* Estilo para cada item da lista */
        .reports-container li {
            margin: 10px;
            flex: 0 0 calc(25% - 20px); /* Calcula a largura dos itens (25% de largura com 20px de margem) */
            max-width: calc(25% - 20px); /* Largura máxima dos itens */
            text-align: center;
        }

        /* Estilo para os links dos relatórios */
        .reports-container a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: block; /* Faz o link ocupar toda a largura do item */
            background-color: #747474; /* Fundo cinza médio */
            border-radius: 5px; /* Bordas arredondadas */
            transition: background-color 0.3s ease, transform 0.3s ease; /* Transição suave */
        }

        /* Efeito de hover nos links */
        .reports-container a:hover {
            background-color: #8F0000; /* Fundo mais escuro no hover */
            transform: scale(1.05); /* Aumenta ligeiramente o tamanho */
        }

        /* Estilo para o formulário de logout */
        .logout-form {
            margin-top: 20px; /* Espaço acima do formulário */
            text-align: center; /* Centraliza o botão de logout */
        }

        /* Estilo para o botão de logout */
        .logout-form button {
            padding: 10px 20px;
            background-color: #63db95;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease; /* Transição suave */
        }

        /* Efeito de hover no botão de logout */
        .logout-form button:hover {
            background-color: #8F0000; /* Fundo mais escuro no hover */
            transform: scale(1.05); /* Aumenta ligeiramente o tamanho */
        }

        /* Media queries para ajuste responsivo */
        @media (max-width: 1200px) {
            .reports-container li {
                flex: 0 0 calc(33.33% - 20px); /* 3 colunas */
                max-width: calc(33.33% - 20px);
            }
        }

        @media (max-width: 900px) {
            .reports-container li {
                flex: 0 0 calc(50% - 20px); /* 2 colunas */
                max-width: calc(50% - 20px);
            }
        }

        @media (max-width: 600px) {
            .reports-container li {
                flex: 0 0 calc(100% - 20px); /* 1 coluna */
                max-width: calc(100% - 20px);
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Define o tempo de expiração em milissegundos (1 hora = 3600 segundos = 3600000 ms)
        const sessionExpiryTime = 14400000;

        // Redireciona automaticamente para a página de login após a expiração
        setTimeout(function(){
            window.location.href = "{% url 'login' %}";
        }, sessionExpiryTime);

        // Monitora a atividade do usuário e redefine o temporizador a cada nova atividade
        function resetTimer() {
            clearTimeout(timer);
            timer = setTimeout(function(){
                window.location.href = "{% url 'login' %}";
            }, sessionExpiryTime);
        }

        // Eventos que serão monitorados para detectar atividade do usuário
        let timer = setTimeout(function(){
            window.location.href = "{% url 'login' %}";
        }, sessionExpiryTime);

        window.onload = resetTimer;
        window.onmousemove = resetTimer;
        window.onmousedown = resetTimer;
        window.ontouchstart = resetTimer;
        window.onclick = resetTimer;
        window.onkeypress = resetTimer;
    </script>
</head>

<body>
    <!-- Container principal dos relatórios -->
    <div class="reports-container">
        <h1>Relatórios Disponíveis</h1>
        <div class="reports-list">
            <ul>
                <!-- Links para os relatórios gerados dinamicamente pelo Python -->
                {% for relatorio in relatorios %}
                <li><a href="{{ relatorio.url }}" target="_blank">{{ relatorio.nome }}</a></li>
                {% endfor %}
            </ul>
        </div>
        <!-- Formulário de logout -->
        <form class="logout-form" action="/logout/" method="POST">
            {% csrf_token %}
            <button type="submit">Sair</button>
        </form>
    </div>
</body>
</html>
