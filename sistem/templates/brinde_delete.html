{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deletar Brinde</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" type="image/x-icon" href="/static/images/favicon2.png">


  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #1e1e1e;
      font-family: 'Roboto', sans-serif;
      display: flex;
      flex-direction: column;
    }

    .center-container {
      justify-items: center;
    }

    .card-body {
      background-color: #2c2929;
      color: white;
      width: 50%;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      position: relative;
      top: 50%;
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      background-color: #0096c7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease-in-out;
      margin: 0 10px;
      text-decoration: none !important;
    }

    .btn:hover {
      background-color: #108eb8;
    }

    .btn-danger {
      background-color: #d9534f;
    }

    .btn-danger:hover {
      background-color: #d2221c;
    }

  </style>
</head>
<body>

  <div class="center-container">
    <div class="card-body">
      <h1>Deletar Brinde</h1>
      <p>Tem certeza que deseja deletar o brinde <strong>{{ object.description }}</strong>?
      <br>
      <p style="color: rgb(211, 211, 5);">ATENÇÃO!</p>
      <p>Isso apagará todos os lançamentos que contenham esse brinde registrado!</p>
      <form method="post">
        {% csrf_token %}
        <div class="buttons-container">
          <button type="submit" class="btn btn-danger">Deletar Brinde</button>
          <a href="{% url 'marketing' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
{% endblock %}
