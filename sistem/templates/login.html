<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.png">
    <title>Sistema Web</title>
    <style>
        /* Estilo para o corpo da página */
        body {
            background-image: var(--body-bg-gradient, radial-gradient(circle, #010f76 0%, #000000 100%));
            background-size: cover;
            background-repeat: no-repeat;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* Container do logo */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 10px; /* Ajustar a logo mais para cima */
        }

        .logo-container img {
            max-width: 300px; /* Responsividade para a logo */
            width: 100%;
            height: auto;
        }

        /* Container do formulário de login */
        .login-container {
            background-color: rgba(0, 0, 0, 0.3); /* Fundo semi-transparente */
            padding: 20px;
            border-radius: 10px; /* Bordas arredondadas */
            margin: 10px;
            width: 100%;
            max-width: 300px; /* Responsividade */
        }

        /* Estilo dos inputs do formulário */
        .login-container input {
            display: block;
            margin: 10px 0;
            width: 100%; /* Responsividade */
            padding: 10px;
            border-radius: 10px; /* Bordas arredondadas */
            box-sizing: border-box;
        }

        /* Estilo do botão de login */
        .login-container button {
            padding: 10px;
            width: 100%; /* Responsividade */
            background-color: #63db95; /* Fundo */
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Efeito de hover no botão de login */
        .login-container button:hover {
            background-color: #8F0000;
        }

        /* Estilo dos labels do formulário */
        .login-container label {
            margin: 10px 0 5px;
        }

        /* Estilo para o checkbox e o texto "Me manter conectado" */
        .login-container .checkbox-container {
            display: flex;
            align-items: flex-start;
            white-space: nowrap;
        }

        .login-container .checkbox-container input {
            margin-right: 10px;
        }

        /* Estilo para o rodapé */
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 0;
            font-size: 10px;
        }

        .footer a {
            color: var(--footer-text);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Ajuste do container principal para manter o login afastado do rodapé */
        .main-container {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <!-- Container do logo -->
    <div class="logo-container">
        <img src="/static/images/logo.png" alt="Logo">
    </div>

    <!-- Container principal para alinhar o login e o texto "BEM VINDO" -->
    <div class="main-container">
        <!-- Container do formulário de login -->
        <div class="login-container">
            <form method="POST">
                {% csrf_token %}
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" name="usuario" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
                <!-- Container do checkbox e texto "Me manter conectado" -->
                <div class="checkbox-container">
                    <input type="checkbox" id="manter_conectado" name="manter_conectado">
                    <label for="manter_conectado">Me manter conectado</label>
                </div>
                <button type="submit">Acessar</button>
            </form>
            {% if erro %}
            <p style="color: red;">{{ erro }}</p>
            {% endif %}
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="footer">
        <p>&copy; 2024 Desenvolvido pelo Departamento de Business Intelligence da Centro Oeste Lubrificantes - 07.606.538/0001-93</p>
        
        <a href="https://wa.me/+556792017120" target="_blank">
            <i class="bi bi-whatsapp"></i> Sabrina Manzoli | Coordenadora de Business Intelligence  
        </a>
        
        <a href="https://wa.me/+556792113061" target="_blank">
            <i class="bi bi-whatsapp"></i> Vander Denardi | Analista de Business Intelligence
        </a>   
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
