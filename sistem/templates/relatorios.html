<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Relatórios</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        font-family: "Roboto", sans-serif;
      }
      
      .content {
        flex-grow: 1;
        padding: 20px;
        display: flex;
        flex-direction: column;
      }
      
      iframe {
        width: 100%;
        height: calc(100vh - 100px);
        border: none;
        background: #ffffff;
      }
      
      .navbar {
        background-color: #f1f1f1;
        color: #000;
        padding: 2px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
        height: 30px;
        font-size: 15px;
      }
      
      .footer {
        background-color: #f1f1f1;
        color: #000;
        padding: 10px;
        text-align: center;
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <nav class="navbar">
        <div>
          <p>Olá {{ usuario }}. Bem-vindo.</p>
        </div>
        <div>
          <button
            class="btn btn-link"
            onclick="logout()"
            style="color: black"
          >
            Encerrar sessão
          </button>
        </div>
      </nav>

      <div id="report-container">
        <iframe src="https://app.powerbi.com/view?r=eyJrIjoiMjY4Yjc5MjQtZmJhMi00NmU1LTk1OTAtYmUzOWM3ZDdjOTY0IiwidCI6ImFjN2Q4YTcyLTBhOGItNDRjZS05NmZjLTdkMWFhMGVjZmMzMSJ9"></iframe>
      </div>

      <footer class="footer">
        <p>&copy; 2025 Desenvolvido pelo Departamento de Business Intelligence</p>
      </footer>
    </div>

    <form
      id="logout-form"
      action="{% url 'logout' %}"
      method="POST"
      style="display: none"
    >
      {% csrf_token %}
    </form>

    <script>
      function logout() {
        document.getElementById('logout-form').submit();
        window.location.href = "{% url 'login' %}";
      }
    </script>
  </body>
</html>
